name: Build APK from zip

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(find . -name "*.zip" | head -1)
          if [ -n "$ZIP" ]; then
            unzip -o "$ZIP" -d unzipped
            INNER=$(find unzipped -name "gradlew" | head -1 | xargs dirname)
            if [ -n "$INNER" ]; then cp -r "$INNER"/. .; fi
          fi

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/gradle-build-action@v2

      - run: chmod +x gradlew

      - run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: CR-Overlay-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
